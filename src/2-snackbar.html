<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 3</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script type="module" src="./js/2-snackbar.js" defer></script>
  </head>
  <body>
    <main>
      <div class="container">
        <a class="back-link" href="./index.html">Go back</a>
      </div>

      <form class="form">
        <label class="label-delay">
          Delay (ms)
          <input type="number" name="delay" class="input-delay" required />
        </label>
      
        <fieldset class="fieldset">
          <legend class="legend">State</legend>
          <label class="radiolabel fulfilled-label">
            <input type="radio" name="state" value="fulfilled" class="radioinput js-fulfilled" required />
            Fulfilled
          </label>
          <label class="radiolabel">
            <input type="radio" name="state" value="rejected" class="radioinput js-rejected" required />
            Rejected
          </label>
        </fieldset>
      
        <button type="submit" class="button-create js-button-create">Create notification</button>
      </form>

    </main>
  </body>
</html>
